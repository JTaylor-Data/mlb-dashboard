app = "<app-name>"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/mlb_data.db"
  SEASON_PHASE = "POSTSEASON"

[http_service]
  internal_port = 8010
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "mlb_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
