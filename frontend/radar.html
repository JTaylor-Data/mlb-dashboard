<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radar - MLB Dashboard</title>
  <link rel="stylesheet" href="css/theme.css?v=9" />
  <style>
    .radar-layout { display: grid; grid-template-columns: 1fr 1.3fr; gap: 24px; align-items: start; }
    @media (max-width: 900px) { .radar-layout { grid-template-columns: 1fr; } }
    .radar-axis-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
    .radar-axis-row { display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .radar-axis-row .label { font-weight: 600; color: var(--text); }
    .radar-axis-row .val { color: var(--text-muted); }
    .radar-axis-row .pct-chip {
      display: inline-block; min-width: 26px; text-align: center; border-radius: 10px;
      padding: 1px 6px; font-weight: 700; font-size: 11px; color: #fff; margin-left: 8px;
    }
  </style>
</head>
<body>
  <div id="nav"></div>
  <div class="page">
    <h1>Radar</h1>

    <div class="controls-row">
      <div style="min-width:320px; flex:1; max-width:420px;">
        <span class="control-label">Player</span>
        <div class="player-search">
          <input type="text" class="player-search-input" id="player-search-input" placeholder="Search any pitcher or hitter..." autocomplete="off" />
          <div class="player-search-dropdown" id="player-search-dropdown"></div>
        </div>
      </div>
      <div>
        <span class="control-label" id="split-label">Opponent bats</span>
        <div class="toggle-group" id="split-toggle">
          <button data-value="ALL" class="active">ALL</button>
          <button data-value="L">L</button>
          <button data-value="R">R</button>
        </div>
      </div>
      <div>
        <span class="control-label">Season</span>
        <select id="season-select"></select>
      </div>
    </div>

    <div class="radar-layout section">
      <div class="card" id="radar-chart-mount"></div>
      <div class="card">
        <h3 style="margin-top:0;">Percentile Profile</h3>
        <div class="radar-axis-list" id="radar-axis-mount"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=9"></script>
  <script src="js/gradient.js?v=9"></script>
  <script src="js/nav.js?v=101"></script>
  <script src="js/player-search.js?v=9"></script>
  <script src="js/season-select.js?v=9"></script>
  <script src="js/radar.js?v=9"></script>
</body>
</html>
