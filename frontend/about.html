<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About - MLB Dashboard</title>
  <link rel="stylesheet" href="css/theme.css?v=45" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .about-content { max-width: 1000px; margin: 0 auto; }

    /* ── Section titles ───────────────────────────────────────────── */
    h2.section-heading {
      font-size: 18px; font-weight: 800; color: var(--forest-dark);
      margin: 32px 0 14px; letter-spacing: -0.3px;
    }

    /* ── Hero card ────────────────────────────────────────────────── */
    .about-hero {
      background: linear-gradient(135deg, var(--surface-alt) 0%, var(--surface) 100%);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 36px 40px; margin-bottom: 28px;
    }
    .about-hero > h1 {
      font-size: 24px; font-weight: 900; letter-spacing: -0.5px;
      color: var(--text); margin: 0 0 24px;
    }
    .about-section { margin-bottom: 26px; }
    .about-section:last-of-type { margin-bottom: 0; }
    .about-section h3 {
      font-size: 13px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase;
      color: var(--forest-dark); margin: 0 0 10px;
    }
    .about-section p {
      font-size: 14px; line-height: 1.75; color: var(--text); margin: 0 0 12px;
    }
    .about-section p:last-child { margin-bottom: 0; }

    /* ── Author links row ─────────────────────────────────────────── */
    .about-links {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--border);
    }
    .about-link {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface);
      font-size: 13px; font-weight: 600; color: var(--text);
      text-decoration: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .about-link:hover { border-color: var(--forest-light); box-shadow: 0 0 0 2px rgba(27,67,50,0.12); }
    .about-link svg { width: 15px; height: 15px; flex-shrink: 0; }
    .about-link.is-disabled {
      opacity: 0.5; pointer-events: none; cursor: default;
    }

    /* ── Model cards ──────────────────────────────────────────────── */
    .model-cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
    .model-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      display: grid; grid-template-columns: auto 1fr;
      gap: 20px; align-items: start; padding: 20px 24px;
      text-decoration: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .model-card:hover {
      border-color: var(--forest-light); box-shadow: 0 0 0 2px rgba(27,67,50,0.12);
    }
    .model-badge {
      width: 52px; height: 52px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; letter-spacing: -0.3px; color: #fff;
    }
    .badge-stuff  { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .badge-tunnel { background: linear-gradient(135deg, #059669, #047857); }
    .badge-loc    { background: linear-gradient(135deg, #d97706, #b45309); }
    .badge-dec    { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
    .model-card-name {
      font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px;
    }
    .model-card-desc {
      font-size: 13px; line-height: 1.55; color: var(--text-muted);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ── Limitations ──────────────────────────────────────────────── */
    .lim-list { list-style: none; padding: 0; margin: 0 0 28px; }
    .lim-item {
      border-left: 3px solid var(--border); padding: 10px 16px;
      margin-bottom: 10px; font-size: 13px; line-height: 1.65; color: var(--text);
    }
    .lim-item:last-child { margin-bottom: 0; }

    /* ── Future work ──────────────────────────────────────────────── */
    .future-list { list-style: none; padding: 0; margin: 0 0 28px; }
    .future-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--text); line-height: 1.6;
    }
    .future-item:last-child { border-bottom: none; }
    .future-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      margin-top: 6px; background: var(--text-muted);
    }

    /* ── Draft notice ─────────────────────────────────────────────── */
    .draft-notice {
      background: #fef9c3; border: 1px solid #fde68a; border-radius: 6px;
      padding: 8px 14px; font-size: 12px; color: #854d0e;
      margin-bottom: 20px; display: inline-block;
    }

    @media (max-width: 600px) {
      .about-hero { padding: 24px 20px; }
      .model-card { padding: 16px 16px; }
    }
  </style>
</head>
<body>
  <div id="nav"></div>
  <div id="subnav"></div>

  <div class="page">
    <div class="about-content">

      <div class="draft-notice">Draft: content under review</div>

      <!-- 1. About -->
      <div class="about-hero">
        <h1>About</h1>

        <div class="about-section">
          <h3>The goal</h3>
          <p id="about-goal-text">Loading&hellip;</p>
        </div>

        <div class="about-section">
          <h3>About the author</h3>
          <p id="about-me-text"></p>
        </div>

        <div class="about-links" id="about-links"></div>
      </div>

      <!-- 2. Short model write-ups -->
      <h2 class="section-heading">The models</h2>
      <div class="model-cards" id="model-cards-container">
        <!-- populated from model_pages.json + about.json -->
      </div>

      <!-- 3. Known limitations -->
      <h2 class="section-heading">Known limitations</h2>
      <ul class="lim-list" id="lim-list"></ul>

      <!-- 4. Future work -->
      <h2 class="section-heading">Future work</h2>
      <ul class="future-list" id="future-list"></ul>

    </div>
  </div>

  <script src="js/api.js?v=18"></script>
  <script src="js/nav.js?v=114"></script>
  <script>
  (async function () {
    try {
      const [aboutData, modelData] = await Promise.all([
        getJSON("content/about.json"),
        getJSON("content/model_pages.json"),
      ]);

      // Goal + about-the-author
      const goalEl = document.getElementById("about-goal-text");
      const meEl = document.getElementById("about-me-text");
      if (goalEl) goalEl.textContent = aboutData.goal.text;
      if (meEl) meEl.textContent = aboutData.about_me.text;

      // Author links
      const linksEl = document.getElementById("about-links");
      if (linksEl) {
        const links = aboutData.links || {};
        const ICONS = {
          linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.03-1.85-3.03-1.86 0-2.14 1.45-2.14 2.94v5.66H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>',
          github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.98 5.24.98 11.5c0 5 3.24 9.24 7.75 10.74.57.1.78-.25.78-.55v-2.1c-3.15.68-3.81-1.34-3.81-1.34-.52-1.3-1.26-1.65-1.26-1.65-1.03-.7.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.73 2.65 1.23 3.3.94.1-.73.4-1.23.72-1.51-2.52-.29-5.16-1.26-5.16-5.6 0-1.24.44-2.25 1.17-3.04-.12-.29-.5-1.44.11-3 0 0 .96-.31 3.15 1.16a10.9 10.9 0 0 1 5.74 0c2.18-1.47 3.14-1.16 3.14-1.16.62 1.56.23 2.71.11 3 .73.79 1.17 1.8 1.17 3.04 0 4.35-2.64 5.3-5.17 5.59.41.35.77 1.04.77 2.1v3.11c0 .3.2.66.79.55A10.52 10.52 0 0 0 23.02 11.5C23.02 5.24 18.27.5 12 .5z"/></svg>',
          resume: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>',
        };
        const row = [
          { key: "linkedin", label: "LinkedIn" },
          { key: "github", label: "GitHub" },
          { key: "resume", label: "Resume" },
        ].map(({ key, label }) => {
          const url = links[key];
          if (url) {
            return `<a class="about-link" href="${url}" target="_blank" rel="noopener">${ICONS[key]}${label}</a>`;
          }
          return `<span class="about-link is-disabled">${ICONS[key]}${label} soon</span>`;
        }).join("");
        linksEl.innerHTML = row;
      }

      // Model cards
      const ORDER = ["stuff_plus", "tunneling_plus", "location_plus", "deception_plus"];
      const container = document.getElementById("model-cards-container");
      if (container) {
        container.innerHTML = ORDER.map((key) => {
          const m = modelData[key];
          if (!m) return "";
          const desc = (aboutData.model_blurbs || {})[key] || "";
          return `
            <a class="model-card" href="${m.slug}">
              <div class="model-badge ${m.badge_class}">${m.badge_code}</div>
              <div>
                <div class="model-card-name">${m.title}</div>
                <div class="model-card-desc">${desc}</div>
              </div>
            </a>`;
        }).join("");
      }

      // Known limitations
      const limList = document.getElementById("lim-list");
      if (limList && aboutData.known_limitations && aboutData.known_limitations.items) {
        limList.innerHTML = aboutData.known_limitations.items.map((item) => {
          const text = typeof item === "string" ? item : item.text;
          return `<li class="lim-item">${text}</li>`;
        }).join("");
      }

      // Future work
      const futureList = document.getElementById("future-list");
      if (futureList && aboutData.future_work && aboutData.future_work.items) {
        futureList.innerHTML = aboutData.future_work.items.map((item) =>
          `<li class="future-item"><span class="future-dot"></span><span>${item}</span></li>`
        ).join("");
      }
    } catch (err) {
      console.error("about.html failed to load content:", err);
    }
  })();
  </script>
</body>
</html>
