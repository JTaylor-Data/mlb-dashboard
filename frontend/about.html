<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About - MLB Dashboard</title>
  <link rel="stylesheet" href="css/theme.css?v=45" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .about-content { max-width: 1000px; margin: 0 auto; }

    /* ── Section titles ───────────────────────────────────────────── */
    h2.section-heading {
      font-size: 18px; font-weight: 800; color: var(--forest-dark);
      margin: 32px 0 14px; letter-spacing: -0.3px;
    }

    /* ── Hero card ────────────────────────────────────────────────── */
    .about-hero {
      background: linear-gradient(135deg, var(--surface-alt) 0%, var(--surface) 100%);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 36px 40px; margin-bottom: 28px;
    }
    .about-hero h2 {
      font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
      color: var(--text); margin: 0 0 10px;
    }
    .about-hero p {
      font-size: 14px; line-height: 1.75; color: var(--text); margin: 0 0 12px;
    }
    .about-hero p:last-child { margin-bottom: 0; }

    /* ── Model cards ──────────────────────────────────────────────── */
    .model-cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
    .model-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      display: grid; grid-template-columns: auto 1fr;
      gap: 20px; align-items: start; padding: 20px 24px;
      text-decoration: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .model-card:hover {
      border-color: var(--forest-light); box-shadow: 0 0 0 2px rgba(27,67,50,0.12);
    }
    .model-badge {
      width: 52px; height: 52px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; letter-spacing: -0.3px; color: #fff;
    }
    .badge-stuff  { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .badge-tunnel { background: linear-gradient(135deg, #059669, #047857); }
    .badge-loc    { background: linear-gradient(135deg, #d97706, #b45309); }
    .badge-dec    { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
    .model-card-name {
      font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px;
    }
    .model-card-desc { font-size: 13px; line-height: 1.65; color: var(--text-muted); }

    /* ── Limitations ──────────────────────────────────────────────── */
    .lim-list { list-style: none; padding: 0; margin: 0 0 28px; }
    .lim-item {
      border-left: 3px solid var(--border); padding: 10px 16px;
      margin-bottom: 10px; font-size: 13px; line-height: 1.65; color: var(--text);
    }
    .lim-item:last-child { margin-bottom: 0; }

    /* ── Future work ──────────────────────────────────────────────── */
    .future-list { list-style: none; padding: 0; margin: 0 0 28px; }
    .future-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--text); line-height: 1.6;
    }
    .future-item:last-child { border-bottom: none; }
    .future-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      margin-top: 6px; background: var(--text-muted);
    }

    /* ── Draft notice ─────────────────────────────────────────────── */
    .draft-notice {
      background: #fef9c3; border: 1px solid #fde68a; border-radius: 6px;
      padding: 8px 14px; font-size: 12px; color: #854d0e;
      margin-bottom: 20px; display: inline-block;
    }

    @media (max-width: 600px) {
      .about-hero { padding: 24px 20px; }
      .model-card { padding: 16px 16px; }
    }
  </style>
</head>
<body>
  <div id="nav"></div>
  <div id="subnav"></div>

  <div class="page">
    <div class="about-content">

      <div class="draft-notice">Draft &mdash; content under review</div>

      <!-- 1. About me -->
      <div class="about-hero">
        <h2>About this project</h2>
        <p id="about-me-text">Loading&hellip;</p>
        <p id="about-purpose-text"></p>
      </div>

      <!-- 3. Short model write-ups -->
      <h2 class="section-heading">The models</h2>
      <div class="model-cards" id="model-cards-container">
        <!-- populated from model_pages.json + about.json -->
      </div>

      <!-- 4. Known limitations -->
      <h2 class="section-heading">Known limitations</h2>
      <ul class="lim-list" id="lim-list"></ul>

      <!-- 5. Future work -->
      <h2 class="section-heading">Future work</h2>
      <ul class="future-list" id="future-list"></ul>

    </div>
  </div>

  <script src="js/api.js?v=18"></script>
  <script src="js/nav.js?v=114"></script>
  <script>
  (async function () {
    try {
      const [aboutData, modelData] = await Promise.all([
        getJSON("content/about.json"),
        getJSON("content/model_pages.json"),
      ]);

      // 1 + 2: About me + purpose
      const meEl = document.getElementById("about-me-text");
      const purpEl = document.getElementById("about-purpose-text");
      if (meEl) meEl.textContent = aboutData.about_me.text;
      if (purpEl) purpEl.textContent = aboutData.purpose.text;

      // 3: Model cards
      const ORDER = ["stuff_plus", "tunneling_plus", "location_plus", "deception_plus"];
      const container = document.getElementById("model-cards-container");
      if (container) {
        container.innerHTML = ORDER.map((key) => {
          const m = modelData[key];
          if (!m) return "";
          const desc = (aboutData.model_blurbs || {})[key] || "";
          return `
            <a class="model-card" href="${m.slug}">
              <div class="model-badge ${m.badge_class}">${m.badge_code}</div>
              <div>
                <div class="model-card-name">${m.title}</div>
                <div class="model-card-desc">${desc}</div>
              </div>
            </a>`;
        }).join("");
      }

      // 4: Known limitations
      const limList = document.getElementById("lim-list");
      if (limList && aboutData.known_limitations && aboutData.known_limitations.items) {
        limList.innerHTML = aboutData.known_limitations.items.map((item) => {
          const text = typeof item === "string" ? item : item.text;
          return `<li class="lim-item">${text}</li>`;
        }).join("");
      }

      // 5: Future work
      const futureList = document.getElementById("future-list");
      if (futureList && aboutData.future_work && aboutData.future_work.items) {
        futureList.innerHTML = aboutData.future_work.items.map((item) =>
          `<li class="future-item"><span class="future-dot"></span><span>${item}</span></li>`
        ).join("");
      }
    } catch (err) {
      console.error("about.html failed to load content:", err);
    }
  })();
  </script>
</body>
</html>
