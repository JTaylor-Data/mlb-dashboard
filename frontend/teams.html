<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teams - MLB Dashboard</title>
  <link rel="stylesheet" href="css/theme.css?v=39" />
  <style>
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(700px, 1fr));
      gap: 28px;
      margin-top: 16px;
    }
    @media (max-width: 760px) { .teams-grid { grid-template-columns: 1fr; } }

    /* League / division headers */
    .league-section { margin-bottom: 32px; }
    .league-title {
      font-size: 13px; font-weight: 800; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--forest-dark);
      border-bottom: 2px solid var(--forest); padding-bottom: 4px;
      margin-bottom: 12px;
    }
    .division-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-muted);
      margin: 18px 0 6px;
    }

    /* Team list table */
    table.teams-table { width: 100%; border-collapse: collapse; }
    table.teams-table th {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.4px; color: var(--text-muted);
      padding: 6px 10px; border-bottom: 1px solid var(--border);
      cursor: pointer; white-space: nowrap; text-align: right;
      background: var(--surface-alt);
    }
    table.teams-table th:first-child { text-align: left; }
    table.teams-table th.sorted { color: var(--forest); }
    table.teams-table th.sorted::after { content: " â–¾"; font-size: 9px; }
    table.teams-table th.sorted.asc::after { content: " â–´"; }
    table.teams-table td {
      padding: 7px 10px; border-bottom: 1px solid var(--border);
      font-size: 13.5px; vertical-align: middle; text-align: right;
    }
    table.teams-table td:first-child { text-align: left; }
    table.teams-table tr:hover td { background: var(--bark-tint); cursor: pointer; }
    .team-row-name {
      display: flex; align-items: center; gap: 8px;
    }
    .team-row-name img { width: 22px; height: 22px; object-fit: contain; }
    .model-score { font-weight: 700; font-family: var(--font-data); }
    .score-good { color: #1a7f37; }
    .score-bad { color: #c9302c; }
    .score-na { color: var(--text-muted); font-weight: 400; }

    /* Detail panel */
    #team-detail { display: none; }
    #team-detail.open { display: block; }
    .detail-header {
      display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
    }
    .detail-header img { width: 54px; height: 54px; object-fit: contain; }
    .detail-name { font-size: 22px; font-weight: 800; color: var(--forest-dark); }
    .detail-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .detail-back {
      background: none; border: none; cursor: pointer; color: var(--forest-light);
      font-size: 13px; font-weight: 700; padding: 0; margin-bottom: 12px;
    }
    .detail-back::before { content: "â† "; }

    .detail-tabs {
      display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 16px;
    }
    .detail-tab {
      background: none; border: none; cursor: pointer;
      padding: 8px 18px; font-size: 13px; font-weight: 700;
      color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -2px;
    }
    .detail-tab.active { color: var(--forest); border-bottom-color: var(--forest); }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .roster-table-wrap { overflow-x: auto; }
    table.roster-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.roster-table th {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.4px; color: var(--text-muted); padding: 5px 8px;
      border-bottom: 1px solid var(--border); background: var(--surface-alt);
      white-space: nowrap;
    }
    table.roster-table td {
      padding: 5px 8px; border-bottom: 1px solid var(--border);
    }
    table.roster-table tr:last-child td { border-bottom: none; }
    .roster-player-link { color: var(--forest-light); text-decoration: none; font-weight: 600; }
    .roster-player-link:hover { text-decoration: underline; }
    .roster-num { text-align: right; font-family: var(--font-data); color: var(--text); }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px; margin-top: 8px;
    }
    .stat-box {
      background: var(--surface-alt); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
    }
    .stat-box-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.4px; color: var(--text-muted); margin-bottom: 4px; }
    .stat-box-value { font-size: 22px; font-weight: 800; color: var(--forest-dark);
      font-family: var(--font-data); }
    .stat-box-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    .model-scores-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .model-badge {
      background: var(--surface-alt); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 16px; min-width: 100px; text-align: center;
    }
    .model-badge-value { font-size: 26px; font-weight: 800; font-family: var(--font-data); }
    .model-badge-label { font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.4px; color: var(--text-muted); margin-top: 2px; }
    .playoff-link {
      display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 700;
      color: var(--forest-light); text-decoration: none;
    }
    .playoff-link:hover { text-decoration: underline; }
    .pulled-at-note { font-size: 11px; color: var(--text-muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div id="nav"></div>
  <div class="page">
    <h1>Teams</h1>
    <div class="loading-bar" id="page-loading"><div class="loading-bar-fill"></div></div>

    <div class="controls-row">
      <div>
        <span class="control-label">Season</span>
        <select id="season-select"></select>
      </div>
      <div class="toggle-group" id="league-toggle">
        <button data-value="ALL" class="active">All</button>
        <button data-value="AL">AL</button>
        <button data-value="NL">NL</button>
      </div>
    </div>

    <div id="teams-list-mount"></div>
    <div id="team-detail"></div>
  </div>

  <script src="js/api.js?v=9"></script>
  <script src="js/gradient.js?v=23"></script>
  <script src="js/nav.js?v=111"></script>
  <script src="js/season-select.js?v=9"></script>
  <script src="js/teams.js?v=1"></script>
</body>
</html>
